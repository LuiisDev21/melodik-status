  summaryJson: ":card_file_box: Estado actualizado [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME está $STATUS ($RESPONSE_CODE en $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: ":bento: Gráficas actualizadas [skip ci] [upptime]"
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "73812536+upptime-bot@users.noreply.github.com"
