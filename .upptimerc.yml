# Configuración de Upptime para Melodik.
# Este fichero es la fuente de verdad: los workflows y el README se regeneran a partir de él.
# Documentación: https://upptime.js.org/docs/configuration

owner: LuiisDev21
repo: melodik-status
user-agent: LuiisDev21

# Solo los secretos que Upptime puede leer. Las URLs vigiladas son públicas,
# así que la lista queda en el webhook opcional de Discord.
secrets:
  - NOTIFICATION_DISCORD_WEBHOOK_URL

sites:
  - name: Melodik (web)
    url: https://melodik.es
    maxResponseTime: 4000

  - name: API
    url: https://melodik.es/api/health
    maxResponseTime: 4000
    # 200 con "ok" o "degraded"; 503 con "down" si la base de datos no contesta.
    __dangerous__body_down_if_regex_missing: '"status":"(ok|degraded)"'

  - name: Base de datos
    url: https://melodik.es/api/health/ready
    maxResponseTime: 4000
    __dangerous__body_down_if_regex_missing: '"status":"ok"'

  - name: Inicio de sesión
    url: https://erzfttnrdiecmwzftxnp.supabase.co/auth/v1/health
    maxResponseTime: 5000

  - name: Deezer
    url: https://api.deezer.com/artist/27
    maxResponseTime: 5000
    # Deezer responde 200 con { error: ... } cuando el recurso no existe.
    __dangerous__body_down_if_regex_missing: '"id":27'

assignees:
  - LuiisDev21

status-website:
  cname: status.melodik.es
  name: Estado de Melodik
  logoUrl: https://melodik.es/icons/icon-192.png
  favicon: https://melodik.es/icons/icon-192.png
  theme: dark
  introTitle: "**Estado de Melodik**"
  introMessage: Disponibilidad de la web, la API, la base de datos y los servicios de los que depende el juego. Los incidentes se abren y se actualizan en [GitHub](https://github.com/LuiisDev21/melodik-status/issues).
  navbar:
    - title: Estado
      href: /
    - title: Incidentes
      href: https://github.com/LuiisDev21/melodik-status/issues
    - title: Melodik
      href: https://melodik.es
  css: |
    :root {
      --body-background-color: #171721;
      --body-text-color: #ededf3;
      --card-background-color: #1e1e2a;
      --nav-background-color: #171721;
      --nav-border-bottom-color: #272735;
      --nav-current-border-bottom-color: #5266eb;
      --card-border-color: #272735;
      --down-border-left-color: #e0578f;
      --down-background-color: rgba(224, 87, 143, .12);
      --degraded-border-left-color: #f6d36b;
      --up-border-left-color: #7ee2b8;
      --tag-color: #0e0e15;
      --tag-up-background-color: #7ee2b8;
      --tag-down-background-color: #e0578f;
      --tag-degraded-background-color: #f6d36b;
      --change-background-color: #5266eb;
      --error-button-border-color: #5266eb;
      --error-button-background-color: #5266eb;
      --error-button-color: #ffffff;
      --submit-button-border-color: #5266eb;
      --submit-button-background-color: #5266eb;
      --submit-button-color: #ffffff;
      --code-background-color: #232330;
      --code-color: #cdddff;
      --graph-opacity: 1;
      --graph-filter: none;
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -.01em;
    }
    .container { max-width: 880px; }
    header h1 { font-size: clamp(26px, 4vw, 34px); letter-spacing: -.8px; line-height: 1.15; }
    header .lead { color: #c3c3cc; line-height: 1.6; }
    h2 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #9cb4e8; }
    nav .logo img { width: 26px; height: 26px; border-radius: 7px; }
    nav .logo div { font-weight: 550; letter-spacing: -.2px; }
    nav a { color: #c3c3cc; }
    nav a:hover, nav a[aria-current="page"] { color: #ededf3; }
    article, .card, section { border-radius: 12px; }
    .up, .down, .degraded { border-radius: 10px; }
    a { color: #9cb4e8; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer { color: #70707d; font-size: 13px; }
    :focus-visible { outline: 2px solid #5266eb; outline-offset: 2px; }

